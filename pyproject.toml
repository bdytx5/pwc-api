[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pwc-papers"
version = "0.2.0"
description = "Fetch ML/AI papers and trending AI repos with GitHub star stats"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/bdytx5/pwc-api"

[tool.setuptools.packages.find]
include = ["pwc_papers*"]
